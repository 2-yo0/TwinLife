<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TWIN LIFE v5</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1625;
    --panel: #241d33;
    --cream: #f4e4c1;
    --pink: #ff8fa3;
    --mint: #7fdbb6;
    --gold: #ffd166;
    --coral: #ff6b6b;
    --purple: #b39ddb;
    --sky: #84d2f6;
    --room-bg: #fffbed;
    --room-floor: #f0ecdd;
    --line: #4a4160;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--cream);
    font-family: 'DotGothic16', sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding: 20px 12px 60px;
  }
  h1 {
    font-family:'Press Start 2P', monospace;
    font-size: 20px; color: var(--gold);
    text-shadow: 3px 3px 0 var(--purple);
    letter-spacing: 2px; margin-bottom: 10px;
  }
  .tagline { color: var(--purple); font-size: 14px; margin-bottom: 18px; }
  .wrap { width: 100%; max-width: 420px; }

  .notice {
    background:#3a2f10; border:2px dashed var(--gold); color:var(--gold);
    font-size:13px; padding:10px 12px; margin-bottom:16px; display:none;
  }
  .notice.show { display:block; }

  /* ══ ROOM : 원본 도트 360×640 좌표계 ══ */
  .room-shell {
    border: 3px solid var(--cream);
    box-shadow: 6px 6px 0 var(--purple);
    background: var(--room-bg);
    margin-bottom: 22px;
    position: relative;
  }
  .room {
    position: relative;
    width: 100%;
    aspect-ratio: 360 / 640;
    overflow: hidden;
    image-rendering: pixelated;
    transition: filter .5s, background .5s;
    background: var(--room-bg);
  }
  .room.mood-sunset { filter: sepia(.25) saturate(1.15) hue-rotate(-12deg) brightness(.97); }
  .room.mood-night  { filter: saturate(.7) brightness(.72) hue-rotate(200deg); }

  /* 통짜 캔버스 레이어 — 전부 0,0 / 100% (좌표 계산 불필요) */
  .layer {
    position:absolute; left:0; top:0; width:100%; height:auto;
    image-rendering: pixelated;
    pointer-events: none;
  }
  .hit {
    position:absolute;
    cursor: pointer;
    background: transparent;
    transition: background .2s;
    z-index: 2;
  }
  .hit.lit { background: rgba(255,209,102,.45); }
  .hit.debug { outline: 1px dashed var(--purple); }

  .ph {
    position: absolute;
    border: 1.5px dashed var(--purple);
    background: rgba(179,157,219,.07);
    display:flex; align-items:flex-end; justify-content:center;
    transition: background .15s;
  }
  .ph span {
    font-size: 10px; color: #8a7fb0;
    background: rgba(255,251,237,.85);
    padding: 0 3px; line-height: 1.4;
    white-space: nowrap;
  }
  .ph.lit { background: rgba(255,209,102,.25); border-color: var(--gold); }

  /* ── 캐릭터 (실제 PNG) ── */
  #charWrap {
    position:absolute;
    transition: left .9s ease, top .9s ease, width .9s ease;
    cursor: pointer;
    z-index: 4;
  }
  #charWrap img {
    width:100%; height:auto; display:block;
    image-rendering: pixelated;
  }
  #speech {
    position:absolute; bottom: 104%; left: 50%;
    transform: translateX(-50%);
    background: var(--room-bg);
    border: 2px solid #6b5d8f;
    box-shadow: 2px 2px 0 rgba(0,0,0,.15);
    color:#3a3350; font-size: 12px;
    padding: 5px 9px; white-space: nowrap;
    opacity: 0; transition: opacity .35s;
    pointer-events: none;
  }
  #speech.show { opacity: 1; }
  #petSpot {
    position:absolute; font-size: 15px;
    opacity:0; transition: opacity .5s; z-index:4;
  }
  #petSpot.show { opacity:1; }

  .asset-dot {
    position:absolute; width: 3%; aspect-ratio:1;
    border: 1px solid #6b5d8f;
    cursor: pointer; z-index:3;
  }
  .frame {
    position:absolute; width: 9%; aspect-ratio: 10/12;
    background: var(--cream);
    border: 2px solid #8a6d3b;
    box-shadow: 2px 2px 0 rgba(0,0,0,.15);
    cursor:pointer; z-index:3;
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
  }
  .trash {
    position:absolute;
    border: 1.5px dashed var(--coral);
    background: rgba(255,107,107,.08);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    cursor:pointer; font-size:11px; color:var(--coral); z-index:3;
  }
  .wallet {
    position:absolute; top: 8px; right: 8px;
    background: var(--room-bg);
    border: 2px solid var(--gold);
    box-shadow: 2px 2px 0 rgba(0,0,0,.2);
    padding: 6px 10px;
    font-family:'Press Start 2P', monospace;
    font-size: 9px; color:#8a6d3b;
    text-align:right; line-height:1.8;
    opacity:0; transition: opacity .6s; z-index:5;
  }
  .wallet.show { opacity:1; }
  .wallet b { color:#5d4a1f; font-size: 11px; }

  /* ══ 온보딩 시트 ══ */
  .sheet {
    position: absolute; left:0; right:0; bottom:0;
    background: var(--panel);
    border-top: 3px solid var(--cream);
    padding: 16px 16px 20px;
    max-height: 62%; overflow-y: auto;
    z-index: 8;
    transition: transform .5s;
  }
  .sheet.hidden { transform: translateY(105%); }
  .sheet h2 {
    font-family:'Press Start 2P', monospace;
    font-size: 12px; color: var(--mint); margin-bottom: 12px;
  }
  .sheet h2::before { content:'▸ '; color: var(--gold); }
  .desc { font-size: 15px; line-height:1.7; color: var(--cream); margin-bottom: 6px; }
  .dots { display:flex; gap:5px; margin-bottom:12px; }
  .dot { width:100%; height:3px; background: var(--line); }
  .dot.on { background: var(--gold); }
  .opt-group { margin-bottom: 12px; }
  .opt-label { font-size: 13px; color: var(--purple); margin-bottom: 6px; }
  .opt-row { display:flex; flex-wrap:wrap; gap:6px; }
  .opt {
    padding: 8px 11px; background: var(--bg); color: var(--cream);
    border: 2px solid var(--line);
    font-family:'DotGothic16', sans-serif; font-size: 14px; cursor:pointer;
  }
  .opt.on { border-color: var(--gold); background:#332a4d; }
  .unlock-hint { font-size:12px; color:#7c6f9e; margin-top:4px; }
  .btn-row { display:flex; gap:8px; margin-top:14px; }
  .btn-back { flex:0 0 52px; background: var(--panel); color: var(--purple); }
  .btn-next { flex:1; background: var(--gold); color:#3a2f10; }

  /* ══ PANELS ══ */
  .panel {
    background: var(--panel);
    border: 2px solid var(--cream);
    box-shadow: 5px 5px 0 var(--mint);
    padding: 18px 16px;
    margin-bottom: 22px;
  }
  .panel h2 {
    font-family:'Press Start 2P', monospace;
    font-size: 13px; color: var(--mint);
    margin-bottom: 16px;
  }
  .panel h2::before { content:'▸ '; color: var(--gold); }
  label { display:block; font-size:14px; color:var(--purple); margin: 10px 0 4px; }
  input, select {
    width:100%; padding: 10px;
    background: var(--bg); color: var(--cream);
    border: 2px solid var(--line);
    font-family:'DotGothic16', sans-serif; font-size: 15px;
  }
  input:focus, select:focus { outline: 2px solid var(--gold); border-color: var(--gold); }

  .meaning-row { display:flex; gap:8px; margin-top:6px; }
  .meaning-btn {
    flex:1; padding: 12px 4px;
    background: var(--bg); color: var(--cream);
    border: 2px solid var(--line);
    font-family:'DotGothic16', sans-serif; font-size:14px;
    cursor:pointer; text-align:center;
  }
  .meaning-btn .ico { display:block; font-size:18px; margin-bottom:4px; }
  .meaning-btn.on { border-color: var(--gold); background: #332a4d; box-shadow: inset 0 0 0 1px var(--gold); }
  .meaning-hint { font-size:12px; color:var(--purple); text-align:center; margin-top:8px; min-height:16px; }

  .btn {
    width:100%; padding: 13px;
    font-family:'Press Start 2P', monospace; font-size: 12px;
    border:2px solid var(--cream); cursor:pointer;
    box-shadow: 3px 3px 0 rgba(0,0,0,.4);
    margin-top: 14px;
  }
  .btn:active { transform: translate(2px,2px); box-shadow:none; }
  .btn-spend { background: var(--gold); color: #3a2f10; }
  .btn-income { background: var(--mint); color: #1c3a2d; }
  .btn-fixed { background: var(--sky); color: #12314a; }
  .quick-row { display:flex; gap:8px; margin-top:10px; }
  .quick {
    flex:1; padding:10px 4px;
    background:var(--bg); color:var(--cream);
    border:2px solid var(--purple);
    font-family:'DotGothic16',sans-serif; font-size:13px; cursor:pointer;
  }
  .quick:active { background:#332a4d; }

  .month-row {
    display:flex; justify-content:space-between; align-items:center;
    padding: 10px 2px;
    border-bottom: 1px dashed var(--line);
    font-size: 15px;
  }
  .month-row:last-child { border-bottom:none; }
  .month-row .amt { font-family:'Press Start 2P',monospace; font-size:11px; }

  .fixed-list { list-style:none; margin-bottom:8px; }
  .fixed-list li {
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 2px; border-bottom:1px dashed var(--line); font-size:15px;
  }
  .fixed-list .meta { color:var(--purple); font-size:12px; display:block; }
  .fixed-list .done { color:var(--mint); font-size:12px; }
  .fixed-list .del {
    background:none; border:1px solid var(--coral); color:var(--coral);
    font-family:'DotGothic16',sans-serif; font-size:12px;
    padding:3px 8px; cursor:pointer; margin-left:8px;
  }
  .fixed-empty { color:var(--purple); font-size:14px; padding:6px 2px 12px; }
  .fixed-form-row { display:flex; gap:8px; }
  .fixed-form-row > div { flex:1; }
  .fixed-form-row > div.narrow { flex:0 0 84px; }

  .overlay {
    position:fixed; inset:0; background:rgba(10,8,18,.75);
    display:none; align-items:center; justify-content:center; z-index:20;
    padding: 20px;
  }
  .overlay.show { display:flex; }
  .modal {
    background:var(--panel); border:2px solid var(--cream);
    box-shadow:6px 6px 0 var(--coral);
    width:100%; max-width:340px; padding:20px;
    max-height:70vh; overflow:auto;
  }
  .modal h3 { font-family:'Press Start 2P',monospace; font-size:12px; color:var(--gold); margin-bottom:14px; }
  .modal ul { list-style:none; }
  .modal li { padding:8px 0; border-bottom:1px dashed var(--line); font-size:15px; display:flex; justify-content:space-between; }
  .modal .empty { color:var(--purple); font-size:14px; }
  .modal .close { margin-top:16px; }
  .footnote { text-align:center; color:var(--purple); font-size:12px; margin-top:4px; }
  .footnote a { color:var(--coral); cursor:pointer; text-decoration:underline; }
  .hidden-el { display:none !important; }
</style>
</head>
<body>
<h1>TWIN LIFE</h1>
<div class="tagline">✦ 남은 것, 추억이 된 것, 지나간 것 ✦</div>

<div class="wrap">

  <div class="notice" id="storageNotice">
    ⚠ 미리보기 모드라 저장이 안 돼요. 파일을 다운받아 브라우저로 열면 기록이 저장됩니다.
  </div>
  <div class="notice" id="fixedNotice"></div>

  <!-- ══ 방 (항상 존재) ══ -->
  <div class="room-shell">
    <div class="room" id="room">
      <div id="layers"></div>
      <div id="hits"></div>

      <div id="charWrap">
        <div id="speech"></div>
        <img id="charBase" alt="character">
      </div>
      <div id="petSpot"></div>

      <div class="wallet" id="wallet">WALLET<br><b id="walletAmt">₩0</b></div>

      <!-- 온보딩 시트 -->
      <div class="sheet" id="sheet">
        <div class="dots" id="dots"></div>
        <div id="stepBox"></div>
      </div>
    </div>
  </div>

  <!-- ══ 온보딩 이후 나타나는 패널들 ══ -->
  <div id="mainApp" class="hidden-el">
    <div class="panel">
      <h2>MONEY LOG</h2>
      <label for="itemName">이름</label>
      <input id="itemName" placeholder="예: 귀걸이, 가족 외식, 커피...">
      <label for="itemAmt">금액 (₩)</label>
      <input id="itemAmt" type="number" inputmode="numeric" placeholder="10000">
      <label for="itemCat">종류</label>
      <select id="itemCat">
        <option value="clothes">👕 옷</option>
        <option value="shoes">👟 신발</option>
        <option value="cosmetics">💄 화장품</option>
        <option value="accessory">💎 귀걸이/액세서리</option>
        <option value="props">🪴 화분/책/소품</option>
        <option value="etc">☕ 기타 (음식, 이동 등)</option>
      </select>
      <label>의미</label>
      <div class="meaning-row" id="meaningRow">
        <button class="meaning-btn on" data-m="asset"><span class="ico">💝</span>남는 것</button>
        <button class="meaning-btn" data-m="memory"><span class="ico">🖼️</span>추억</button>
        <button class="meaning-btn" data-m="gone"><span class="ico">🗑️</span>소모</button>
      </div>
      <div class="meaning-hint" id="meaningHint">옷, 신발, 가구처럼 내게 남는 것</div>
      <button class="btn btn-spend" id="spendBtn">SPEND ₩</button>
      <div class="quick-row">
        <button class="quick" data-q="coffee">☕ 커피</button>
        <button class="quick" data-q="dining">🍽️ 외식</button>
        <button class="quick" data-q="plant">🪴 화분</button>
      </div>
      <button class="btn btn-income" id="incomeBtn">+ INCOME</button>
    </div>

    <div class="panel">
      <h2>FIXED</h2>
      <ul class="fixed-list" id="fixedList"></ul>
      <div class="fixed-empty" id="fixedEmpty">월세, 구독료 같은 매달 나가는 돈을 등록해두면 날짜에 맞춰 자동으로 차감돼요.</div>
      <div class="fixed-form-row">
        <div>
          <label for="fixName">이름</label>
          <input id="fixName" placeholder="예: 월세">
        </div>
        <div class="narrow">
          <label for="fixDay">매달 (일)</label>
          <input id="fixDay" type="number" inputmode="numeric" min="1" max="31" placeholder="25">
        </div>
      </div>
      <label for="fixAmt">금액 (₩)</label>
      <input id="fixAmt" type="number" inputmode="numeric" placeholder="500000">
      <button class="btn btn-fixed" id="fixAddBtn">+ ADD FIXED</button>
    </div>

    <div class="panel">
      <h2>THIS MONTH</h2>
      <div class="month-row"><span>💝 남은 자산</span><span class="amt" id="sumAsset" style="color:var(--gold)">₩0</span></div>
      <div class="month-row"><span>🖼️ 추억으로</span><span class="amt" id="sumMemory" style="color:var(--pink)">₩0</span></div>
      <div class="month-row"><span>🗑️ 지나간 것</span><span class="amt" id="sumGone" style="color:var(--sky)">₩0</span></div>
    </div>

    <div class="footnote">✦ 캐릭터·휴지통·액자를 눌러보세요 ✦ <a id="resetLink">데이터 초기화</a> ✦</div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">LIST</h3>
    <ul id="modalList"></ul>
    <button class="btn btn-spend close" id="modalClose">CLOSE</button>
  </div>
</div>

<script>

   원본 도트 캔버스: 360 × 640
   - 온보딩과 방을 한 파일로 통합
   - 캐릭터: 실제 PNG 장착 (41×87 @ 20,201 실측)

    accessory: null,  /* 액세서리 */
  }
};

const store = {
  ok: (() => {
    try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }
    catch(e) { return false; }
  })(),
  load() {
    if (!this.ok) return null;
    try { return JSON.parse(localStorage.getItem('twinLife') || 'null'); }
    catch(e) { return null; }
  },
  save(data) {
    if (!this.ok) return;
    try { localStorage.setItem('twinLife', JSON.stringify(data)); } catch(e) {}
  },
  clear() { if (this.ok) try { localStorage.removeItem('twinLife'); } catch(e) {} }
};

function placeCharIntro() {
  charWrap.style.width = pct(CHAR.w * 1.7, CANVAS.w);
  charWrap.style.left  = pct((CANVAS.w - CHAR.w * 1.7) / 2, CANVAS.w);
  charWrap.style.top   = pct(150, CANVAS.h);
}
function placeCharHome() {
  charWrap.style.width = pct(CHAR.w, CANVAS.w);
  charWrap.style.left  = pct(CHAR.x, CANVAS.w);
  charWrap.style.top   = pct(CHAR.y, CANVAS.h);

const GREETINGS = [

];
charWrap.onclick = () => {
  if (!state.onboarded) return;
  say(GREETINGS[Math.floor(Math.random() * GREETINGS.length)], 2200);
};

function say(text, ms) {
  const s = document.getElementById('speech');
  s.textContent = text;
  s.classList.add('show');
  clearTimeout(say._t);
  if (ms) say._t = setTimeout(() => s.classList.remove('show'), ms);
}

function renderPet() {
  const p = document.getElementById('petSpot');
  if (!state.profile.pet) { p.classList.remove('show'); return; }
  p.textContent = state.profile.pet;
  p.style.left = pct(PET_SPOT.x, CANVAS.w);
  p.style.top  = pct(PET_SPOT.y, CANVAS.h);
  p.classList.add('show');
}

/* ── 방 안 동적 요소 ── */
function renderRoomItems() {
  room.querySelectorAll('.asset-dot, .frame').forEach(el => el.remove());
  state.assets.forEach((e, i) => drawAssetDot(e, i));
  state.memories.forEach((e, i) => drawFrame(e, i));
  document.getElementById('trashCount').textContent = state.gone.length;
}

function drawAssetDot(entry, i) {
  const f = FURNITURE.find(x => x.key === STORAGE_MAP[entry.cat]);
  const dot = document.createElement('div');
  dot.className = 'asset-dot';
  dot.title = entry.name;
  dot.style.background = ASSET_COLORS[i % ASSET_COLORS.length];
  if (f) {
    dot.style.left = pct(f.x + 4 + (i % 5) * 13, CANVAS.w);
    dot.style.top = pct(f.y + f.h + 4 + Math.floor(i / 5) * 13, CANVAS.h);
  } else {
    dot.style.left = pct(230 + (i % 5) * 14, CANVAS.w);
    dot.style.top = pct(470 + Math.floor(i / 5) * 14, CANVAS.h);
  }
  dot.onclick = () => showList('💝 남은 자산', state.assets);
  room.appendChild(dot);
}

function drawFrame(entry, i) {
  const slot = FRAME_SLOTS[i % FRAME_SLOTS.length];
  const fr = document.createElement('div');
  fr.className = 'frame';
  fr.style.left = pct(slot.x, CANVAS.w);
  fr.style.top = pct(slot.y, CANVAS.h);
  fr.style.transform = 'rotate(' + slot.r + 'deg)';
  fr.textContent = '🖼️';
  fr.title = entry.name;
  fr.onclick = () => showList('🖼️ ' + entry.name, [entry]);
  room.appendChild(fr);
}

function flash(key) {
  const el = document.getElementById('ph-' + key);
  if (!el) return;
  el.classList.add('lit');
  setTimeout(() => el.classList.remove('lit'), 900);
}

  },
  { title:'ROOM MOOD',
    html:() => optRow('방의 분위기를 골라줘 (나중에 바꿀 수 있어)', MOODS, 'mood') +
      '<div class="unlock-hint">벽지, 바닥, 조명은 살면서 하나씩</div>',
    next:'이 무드로 할래',
  },
  { title:'BUDGET',
    html:() =>
      '<div class="desc">마지막! 이번 달 쓸 수 있는 돈을 알려줘.<br>' +
      '방 오른쪽 위에 지갑으로 걸어둘게.</div>' +
      '<div class="opt-group"><div class="opt-label">이번 달 예산 (₩)</div>' +
      '<input id="budgetInput" type="number" inputmode="numeric" placeholder="예: 1500000"></div>',
    next:'START ✦',
    onLeave:() => {
      const v = parseInt(document.getElementById('budgetInput').value, 10);
      if (!v || v <= 0) { alert('예산 금액을 입력해줘!'); return false; }
      state.wallet = v;
      return true;
    },
  },
];

let step = 0;
document.getElementById('dots').innerHTML =
  STEPS.map(() => '<span class="dot"></span>').join('');

function renderStep() {
  document.querySelectorAll('.dot').forEach((d,i) => d.classList.toggle('on', i <= step));
  const s = STEPS[step];
  document.getElementById('stepBox').innerHTML =
    '<h2>' + s.title + '</h2>' + s.html() +
    '<div class="btn-row">' +
      (step > 0 ? '<button class="btn btn-back" id="backBtn">←</button>' : '') +
      '<button class="btn btn-next" id="nextBtn">' + s.next + '</button>' +
    '</div>';

  if (s.onEnter) s.onEnter();

  document.querySelectorAll('.opt').forEach(b => {
    b.onclick = () => {
      state.profile[b.dataset.key] = b.dataset.val;
      b.parentElement.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      if (b.dataset.key === 'mood') room.className = 'room ' + state.profile.mood;
      if (b.dataset.key === 'pet' && b.dataset.val) {
        renderPet();
        say('오, 친구가 생기는 거야?', 1800);
      }
      if (b.dataset.key === 'pet' && !b.dataset.val) renderPet();
    };
  });

  document.getElementById('nextBtn').onclick = () => {
    if (s.onLeave && !s.onLeave()) return;
    if (step < STEPS.length - 1) { step++; renderStep(); }
    else finishOnboarding();
  };
  const back = document.getElementById('backBtn');
  if (back) back.onclick = () => { step--; renderStep(); };
}

function finishOnboarding() {
  state.onboarded = true;
  document.getElementById('sheet').classList.add('hidden');
  placeCharHome();
  enterRoom();
  refresh();
  setTimeout(() => say(state.profile.name + ', 어서 와. 이제 여기서 살자 ✦', 3500), 1000);
}

/* 온보딩 이후 공통 진입 */
function enterRoom() {
  document.getElementById('mainApp').classList.remove('hidden-el');
  document.getElementById('wallet').classList.add('show');
  room.className = 'room ' + (state.profile.mood || '');
  renderPet();
}

/* ═══════ 기록 ═══════ */
const HINTS = {
  asset:  '옷, 신발, 가구처럼 내게 남는 것',
  memory: '가족 외식, 여행처럼 추억이 되는 것',
  gone:   '커피, 택시처럼 지나가는 것',
};
let meaning = 'asset';
document.querySelectorAll('.meaning-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.meaning-btn').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    meaning = b.dataset.m;
    document.getElementById('meaningHint').textContent = HINTS[meaning];
  };
});

const REACT = {
  asset:  ['이건 남네.', '방이 조금 채워졌어.', '오래 쓰자.'],
  memory: ['벽에 걸어둘게.', '좋은 날이었나 봐.', '기억해둘게.'],
  gone:   ['지나갔다.', '휴지통으로.', '그런 날도 있지.'],
};

function spend(name, amt, cat, m) {
  if (!name || !amt || amt <= 0) { alert('이름과 금액을 입력해주세요!'); return; }
  state.wallet -= amt;
  const entry = { name, amt, cat, date: new Date().toISOString() };
  if (m === 'asset') {
    state.assets.push(entry);
    drawAssetDot(entry, state.assets.length - 1);
    if (STORAGE_MAP[cat]) flash(STORAGE_MAP[cat]);
  } else if (m === 'memory') {
    state.memories.push(entry);
    drawFrame(entry, state.memories.length - 1);
  } else {
    state.gone.push(entry);
    document.getElementById('trashCount').textContent = state.gone.length;
  }
  const lines = REACT[m];
  say(lines[Math.floor(Math.random() * lines.length)], 2600);
  refresh();
}

document.getElementById('spendBtn').onclick = () => {
  const name = document.getElementById('itemName').value.trim();
  const amt = parseInt(document.getElementById('itemAmt').value, 10);
  spend(name, amt, document.getElementById('itemCat').value, meaning);
  document.getElementById('itemName').value = '';
  document.getElementById('itemAmt').value = '';
};

const QUICK = {
  coffee: { name:'커피', amt:5000,  cat:'etc',   m:'gone' },
  dining: { name:'외식', amt:30000, cat:'etc',   m:'memory' },
  plant:  { name:'화분', amt:15000, cat:'props', m:'asset' },
};
document.querySelectorAll('.quick').forEach(b => {
  b.onclick = () => { const q = QUICK[b.dataset.q]; spend(q.name, q.amt, q.cat, q.m); };
});

document.getElementById('incomeBtn').onclick = () => {
  const amt = parseInt(document.getElementById('itemAmt').value, 10);
  if (!amt || amt <= 0) { alert('금액 칸에 수입 금액을 넣고 눌러주세요!'); return; }
  state.wallet += amt;
  document.getElementById('itemAmt').value = '';
  refresh();
};

/* ── 고정지출 ── */
document.getElementById('fixAddBtn').onclick = () => {
  const name = document.getElementById('fixName').value.trim();
  const amt = parseInt(document.getElementById('fixAmt').value, 10);
  const day = parseInt(document.getElementById('fixDay').value, 10);
  if (!name || !amt || amt <= 0 || !day || day < 1 || day > 31) {
    alert('이름, 금액, 날짜(1~31)를 모두 입력해주세요!');
    return;
  }
  state.fixed.push({ id: Date.now(), name, amt, day });
  document.getElementById('fixName').value = '';
  document.getElementById('fixAmt').value = '';
  document.getElementById('fixDay').value = '';
  applyFixedExpenses();
  renderFixedList();
  refresh();
};

function removeFixed(id) {
  state.fixed = state.fixed.filter(f => f.id !== id);
  renderFixedList();
  refresh();
}

function renderFixedList() {
  const ul = document.getElementById('fixedList');
  const applied = state.fixedLog[monthKey()] || [];
  ul.innerHTML = state.fixed.map(f =>
    '<li><span>' + f.name +
    '<span class="meta">매달 ' + f.day + '일 · ' + won(f.amt) +
    (applied.includes(f.id) ? ' <span class="done">✔ 이번 달 반영됨</span>' : '') +
    '</span></span>' +
    '<button class="del" data-id="' + f.id + '">삭제</button></li>'
  ).join('');
  document.getElementById('fixedEmpty').style.display = state.fixed.length ? 'none' : 'block';
  ul.querySelectorAll('.del').forEach(b => {
    b.onclick = () => removeFixed(parseInt(b.dataset.id, 10));
  });
}

function applyFixedExpenses() {
  const mk = monthKey();
  if (!state.fixedLog[mk]) state.fixedLog[mk] = [];
  const today = new Date().getDate();
  const appliedNow = [];
  state.fixed.forEach(f => {
    if (today >= f.day && !state.fixedLog[mk].includes(f.id)) {
      state.wallet -= f.amt;
      state.gone.push({ name: f.name + ' (고정)', amt: f.amt, cat:'etc', date: new Date().toISOString() });
      state.fixedLog[mk].push(f.id);
      appliedNow.push(f);
    }
  });
  if (appliedNow.length) {
    const n = document.getElementById('fixedNotice');
    n.textContent = '📌 이번 달 고정지출 ' + appliedNow.length + '건이 자동 반영됐어요: '
      + appliedNow.map(f => f.name + ' ' + won(f.amt)).join(', ');
    n.classList.add('show');
    document.getElementById('trashCount').textContent = state.gone.length;
  }
}

/* ── 요약 & 저장 ── */
function refresh() {
  const sum = a => a.reduce((s, e) => s + e.amt, 0);
  document.getElementById('walletAmt').textContent = won(state.wallet);
  document.getElementById('sumAsset').textContent = won(sum(state.assets));
  document.getElementById('sumMemory').textContent = won(sum(state.memories));
  document.getElementById('sumGone').textContent = won(sum(state.gone));
  store.save(state);
}

/* ── 모달 ── */
function showList(title, arr) {
  document.getElementById('modalTitle').textContent = title;
  const ul = document.getElementById('modalList');
  ul.innerHTML = arr.length
    ? arr.map(e => '<li><span>' + e.name + '</span><span>' + won(e.amt) + '</span></li>').join('')
    : '<li class="empty">아직 비어있어요. 첫 기록을 남겨보세요!</li>';
  document.getElementById('overlay').classList.add('show');
}
document.getElementById('modalClose').onclick =
  () => document.getElementById('overlay').classList.remove('show');
document.getElementById('overlay').onclick = e => {
  if (e.target.id === 'overlay') e.target.classList.remove('show');
};

document.getElementById('resetLink').onclick = () => {
  if (!confirm('모든 기록이 삭제돼요. 정말 초기화할까요?')) return;
  store.clear();
  location.reload();
};

/* ── 부팅 ── */
(function boot() {
  if (!store.ok) document.getElementById('storageNotice').classList.add('show');
  const saved = store.load();

  if (saved && saved.onboarded) {
    state = Object.assign(state, saved);
    state.profile = Object.assign({ name:'', pet:'', exercise:'want', goal:'', mood:'' }, saved.profile || {});
    document.getElementById('sheet').classList.add('hidden');
    placeCharHome();
    enterRoom();
    applyFixedExpenses();
    renderRoomItems();
    renderFixedList();
    refresh();
    setTimeout(() => say(
      state.profile.name ? state.profile.name + ', 왔네.' : '왔네.', 2600), 600);
  } else {
    placeCharIntro();
    renderStep();
  }
})();
</script>
</body>
</html>
